apiVersion: v1
kind: Secret

metadata:
  name: users-secret
  labels:
    app: users
  annotations:
    description: "Secret para a API de Usuários."

type: Opaque

stringData:
  # Db
  DB_USER_CONNECTION_STRING: "Host=postgresdb-users;Port=5432;Database=users-db;Username=<usuario-postgres>;Password=<senha-postgres>;"

  # Firebase
  FIREBASE_CREDENTIAL_PATH: "/app/firebase-service-account.json"
  FIREBASE_API_KEY: "<chave-api-firebase>"
