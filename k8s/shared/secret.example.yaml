apiVersion: v1
kind: Secret

metadata:
  name: shared-secret
  labels:
    app: shared
  annotations:
    description: "Secret compartilhado para as APIs de Notificações, Usuário, Catálogo e Pagamento."

type: Opaque

stringData:
  # RabbitMQ
  RABBITMQ_USERNAME: "<usuario-rabbitmq>"
  RABBITMQ_PASSWORD: "<senha-rabbitmq>"

  # MongoDB
  MONGO_ROOT_USER: "<usuario-mongo>"
  MONGO_ROOT_PASSWORD: "<senha-mongo>"
  MONGO_EXPRESS_USER: "<usuario-mongo-express>"
  MONGO_EXPRESS_PASSWORD: "<senha-mongo-express>"
  MONGO_CONNECTION_STRING: "mongodb://<usuario-mongo>:<senha-mongo>@mongodb:27017/"
  MONGO_DATABASE_CATALOG: "catalog-db"
  MONGO_EXPRESS_URL: "mongodb://<usuario-mongo>:<senha-mongo>@mongodb:27017/"

  # Redis
  REDIS_PASSWORD: "<senha-redis>"
  REDIS_CONNECTION_STRING: "redis:6379,password=<senha-redis>,abortConnect=false"

  # New Relic
  NEW_RELIC_LICENSE_KEY_LAMBDA: "<chave-licenca-newrelic>"
  NEW_RELIC_LICENSE_KEY: "<chave-licenca-newrelic>"
  NEW_RELIC_APP_NAME_PAYMENTS: "FiapCloudGames-Payments-Logs"
  NEW_RELIC_APP_NAME_CATALOGS: "FiapCloudGames-Catalog-Logs"
  NEW_RELIC_APP_NAME_USERS: "FiapCloudGames-User-Logs"

  # PostgreSQL
  POSTGRES_USER: "<usuario-postgres>"
  POSTGRES_PASSWORD: "<senha-postgres>"

  # SQS (LocalStack — "test" é o valor dummy padrão do LocalStack, não é segredo real)
  SQS_REGION: "us-east-1"
  SQS_ACCESS_KEY: "test"
  SQS_SECRET_KEY: "test"

  # Firebase
  FIREBASE_CREDENTIAL_PATH: "/app/firebase-service-account.json"
  FIREBASE_APIKEY: "<chave-api-firebase>"
