apiVersion: apps/v1
kind: StatefulSet

metadata:
  name: postgresdb-catalog

  labels:
    app: postgresdb-catalog

  annotations:
    description: "Pod para o banco de dados PostgreSQL, utilizado pela API de Catálogo para armazenar informações de catálogo."

spec:
  serviceName: postgresdb-catalog
  replicas: 1

  selector:
    matchLabels:
      app: postgresdb-catalog

  template:
    metadata:
      labels:
        app: postgresdb-catalog

    spec:
      # Garante que o usuário do processo postgres (uid 999) tenha permissão de escrita no volume EBS
      securityContext:
        fsGroup: 999

      containers:
        - name: postgresdb-catalog
          image: postgres:16

          ports:
            - containerPort: 5432

          resources:
            requests: #minimum resources guaranteed to the container
              memory: "256Mi"
              cpu: "250m"

            limits: #maximum resources that the container can use
              memory: "512Mi"
              cpu: "500m"

          env:
            - name: POSTGRES_DB
              value: "catalog-db"

            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: shared-secret
                  key: POSTGRES_USER

            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: shared-secret
                  key: POSTGRES_PASSWORD

            # Usa subdiretório para evitar conflito com "lost+found" criado em volumes EBS recém-formatados
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata

          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data

          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - $(POSTGRES_USER)
                - -d
                - catalog-db
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5

          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - $(POSTGRES_USER)
                - -d
                - catalog-db
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5

      volumes:
      - name: postgres-storage
        persistentVolumeClaim:
          claimName: postgres-pvc-catalog