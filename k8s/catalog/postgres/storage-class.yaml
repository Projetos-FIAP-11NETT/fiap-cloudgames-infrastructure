apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: auto-ebs-sc
allowedTopologies:
  - matchLabelExpressions:
      - key: eks.amazonaws.com/compute-type
        values:
          - auto
provisioner: ebs.csi.eks.amazonaws.com   # provisioner específico do EKS Auto Mode (não é ebs.csi.aws.com)
volumeBindingMode: WaitForFirstConsumer
parameters:
  type: gp3
  encrypted: "true"